<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #C9A84C; --gold-light: #E8D5A3; --gold-pale: #F5EDD8;
    --milk: #F7F3EC; --milk-white: #FDFAF5; --cream: #F0EAE0;
    --near-black: #1A1A1A; --charcoal: #2D2D2D; --muted: #7A7268; --white: #FFFFFF;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Jost', sans-serif; background: var(--milk-white); color: var(--near-black); overflow-x: hidden; }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; height: 72px; background: rgba(253,250,245,0.96); backdrop-filter: blur(12px); border-bottom: 0.5px solid rgba(201,168,76,0.2); }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 500; letter-spacing: 0.12em; color: var(--near-black); text-decoration: none; }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a { font-size: 13px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: var(--charcoal); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--gold); }
  .nav-actions { display: flex; align-items: center; gap: 24px; }
  .nav-icon { background: none; border: none; cursor: pointer; color: var(--charcoal); transition: color 0.2s; }
  .nav-icon:hover { color: var(--gold); }
  .nav-cart-btn { display: flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--near-black); color: var(--white); font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; border: none; cursor: pointer; transition: background 0.25s; text-decoration: none; }
  .nav-cart-btn:hover { background: var(--gold); }
  .nav-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
  .nav-hamburger span { display: block; width: 22px; height: 1.5px; background: var(--near-black); transition: all 0.3s; }

  /* PAGE HEADER */
  .page-header { margin-top: 72px; padding: 70px 60px 50px; background: var(--near-black); }
  .page-header-eyebrow { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: rgba(201,168,76,0.75); letter-spacing: 0.08em; margin-bottom: 12px; }
  .page-header-title { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 500; color: var(--white); margin-bottom: 8px; }
  .page-header-sub { font-size: 15px; font-weight: 300; color: rgba(255,255,255,0.5); }

  /* SEARCH BAR */
  .support-search { padding: 40px 60px; background: var(--cream); border-bottom: 0.5px solid rgba(201,168,76,0.15); }
  .search-wrap { max-width: 600px; margin: 0 auto; position: relative; }
  .search-input { width: 100%; padding: 16px 56px 16px 20px; background: var(--white); border: 1px solid rgba(201,168,76,0.35); font-family: 'Jost', sans-serif; font-size: 15px; color: var(--near-black); outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--muted); font-weight: 300; }
  .search-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 52px; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .search-btn:hover { background: var(--near-black); }
  .search-btn svg { color: var(--near-black); }
  .search-btn:hover svg { color: var(--gold); }

  /* TOPIC CARDS */
  .topics-section { padding: 80px 60px; }
  .section-label { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 12px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 500; margin-bottom: 48px; }
  .topics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .topic-card { padding: 36px 32px; background: var(--milk); border: 0.5px solid rgba(201,168,76,0.15); cursor: pointer; transition: border-color 0.25s, background 0.25s; text-decoration: none; display: block; }
  .topic-card:hover { border-color: var(--gold); background: var(--gold-pale); }
  .topic-icon { width: 48px; height: 48px; border: 1px solid rgba(201,168,76,0.35); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; transition: border-color 0.25s; }
  .topic-card:hover .topic-icon { border-color: var(--gold); }
  .topic-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 500; color: var(--near-black); margin-bottom: 8px; }
  .topic-desc { font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .topic-link { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .topic-arrow { width: 18px; height: 1px; background: var(--gold); position: relative; transition: width 0.25s; }
  .topic-card:hover .topic-arrow { width: 26px; }
  .topic-arrow::after { content: ''; position: absolute; right: 0; top: -3px; width: 6px; height: 6px; border-right: 1px solid var(--gold); border-top: 1px solid var(--gold); transform: rotate(45deg); }

  /* FAQ */
  .faq-section { padding: 80px 60px; background: var(--milk); }
  .faq-tabs { display: flex; gap: 0; margin-bottom: 40px; flex-wrap: wrap; }
  .faq-tab { padding: 12px 28px; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; border: 0.5px solid rgba(201,168,76,0.25); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .faq-tab.active { background: var(--near-black); color: var(--white); border-color: var(--near-black); }
  .faq-tab:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
  .faq-list { display: flex; flex-direction: column; max-width: 760px; }
  .faq-item { border-bottom: 0.5px solid rgba(201,168,76,0.2); }
  .faq-question { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 22px 0; background: none; border: none; cursor: pointer; text-align: left; gap: 20px; }
  .faq-q-text { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 400; color: var(--near-black); line-height: 1.4; }
  .faq-icon { flex-shrink: 0; width: 28px; height: 28px; border: 0.5px solid rgba(201,168,76,0.4); display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.3s; }
  .faq-item.open .faq-icon { background: var(--gold); transform: rotate(45deg); }
  .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; }
  .faq-answer-inner { padding: 0 0 22px; font-size: 14px; font-weight: 300; color: var(--charcoal); line-height: 1.85; }

  /* TRACK ORDER */
  .track-section { padding: 80px 60px; background: var(--near-black); }
  .track-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .track-content .section-label { color: rgba(201,168,76,0.75); }
  .track-content .section-title { color: var(--white); margin-bottom: 16px; }
  .track-content p { font-size: 15px; font-weight: 300; color: rgba(255,255,255,0.55); line-height: 1.8; }
  .track-form { display: flex; flex-direction: column; gap: 14px; }
  .track-input { padding: 14px 18px; background: rgba(255,255,255,0.06); border: 0.5px solid rgba(201,168,76,0.2); color: var(--white); font-family: 'Jost', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .track-input::placeholder { color: rgba(255,255,255,0.3); }
  .track-input:focus { border-color: var(--gold); }
  .track-btn { padding: 14px; background: var(--gold); color: var(--near-black); font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; border: none; cursor: pointer; transition: background 0.2s; }
  .track-btn:hover { background: var(--gold-light); }

  /* CARE GUIDE */
  .care-section { padding: 80px 60px; }
  .care-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin-top: 48px; }
  .care-card { padding: 28px 24px; border: 0.5px solid rgba(201,168,76,0.2); background: var(--milk); }
  .care-num { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 36px; color: var(--gold-light); margin-bottom: 14px; }
  .care-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 500; margin-bottom: 10px; }
  .care-text { font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.75; }

  /* CONTACT CTA */
  .support-cta { padding: 80px 60px; background: var(--gold-pale); text-align: center; }
  .support-cta h2 { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 500; margin-bottom: 14px; }
  .support-cta p { font-size: 15px; font-weight: 300; color: var(--muted); max-width: 420px; margin: 0 auto 36px; line-height: 1.75; }
  .btn-primary { display: inline-flex; align-items: center; gap: 10px; padding: 16px 40px; background: var(--near-black); color: var(--white); font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; border: none; cursor: pointer; transition: background 0.25s; }
  .btn-primary:hover { background: var(--gold); color: var(--near-black); }

  /* FOOTER */
  footer { background: var(--near-black); padding: 50px 60px 32px; }
  .footer-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding-top: 32px; border-top: 0.5px solid rgba(255,255,255,0.08); }
  .footer-copy { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.3); }
  .footer-brand-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 500; color: var(--white); letter-spacing: 0.1em; margin-bottom: 8px; }
  .footer-brand-name span { color: var(--gold); }
  .footer-legal { display: flex; gap: 24px; }
  .footer-legal a { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
  .footer-legal a:hover { color: var(--white); }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 900px) {
    nav { padding: 0 24px; }
    .nav-links, .nav-cart-btn { display: none; }
    .nav-hamburger { display: flex; }
    .mobile-menu { display: none; position: fixed; top: 72px; left: 0; right: 0; background: var(--milk-white); border-top: 0.5px solid rgba(201,168,76,0.2); z-index: 99; padding: 24px; flex-direction: column; gap: 0; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { display: block; padding: 16px 0; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 400; color: var(--near-black); text-decoration: none; border-bottom: 0.5px solid rgba(201,168,76,0.15); transition: color 0.2s; }
    .mobile-menu a:hover { color: var(--gold); }
    .mobile-menu a.cart { margin-top: 20px; padding: 14px 24px; background: var(--near-black); color: var(--white); text-align: center; border-bottom: none; }
    .page-header { padding: 50px 24px 36px; }
    .page-header-title { font-size: 36px; }
    .support-search { padding: 28px 24px; }
    .topics-section { padding: 56px 24px; }
    .topics-grid { grid-template-columns: 1fr; gap: 16px; }
    .faq-section { padding: 56px 24px; }
    .track-section { padding: 56px 24px; }
    .track-inner { grid-template-columns: 1fr; gap: 40px; }
    .care-section { padding: 56px 24px; }
    .care-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
    .support-cta { padding: 60px 24px; }
    footer { padding: 40px 24px 28px; }
    .section-title { font-size: 28px; }
  }
  @media (max-width: 540px) {
    .page-header-title { font-size: 30px; }
    .care-grid { grid-template-columns: 1fr; }
    .faq-tab { padding: 10px 16px; font-size: 11px; }
  }

  /* ═══ LOGO IMAGE — RESPONSIVE ═══ */
  .nav-logo-img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    /* removes white bg from PNG */
    mix-blend-mode: multiply;
    display: block;
    flex-shrink: 0;
  }
  /* On dark backgrounds (footer, hero) use luminosity blend */
  .footer-logo-img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    mix-blend-mode: luminosity;
    filter: brightness(1.1);
    display: block;
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .nav-logo-img { width: 36px; height: 36px; }
    .footer-logo-img { width: 30px; height: 30px; }
  }
  @media (max-width: 540px) {
    .nav-logo-img { width: 32px; height: 32px; }
  }


/* ═══ ANDROID / CROSS-BROWSER FIXES ═══ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
input, select, textarea, button {
  -webkit-appearance: none;
  font-size: 16px; /* prevents iOS/Android zoom on focus */
}
@media (max-width: 900px) {
  input, select, textarea { font-size: 15px !important; }
}
/* Prevent horizontal scroll from any overflow */
html, body { max-width: 100%; overflow-x: hidden; }
/* Tap highlight removal for Android */
a, button { -webkit-tap-highlight-color: transparent; }
/* Minimum tap target size for Android accessibility (48x48dp) */
@media (max-width: 900px) {
  .nav-hamburger, .product-wishlist, .mob-qty-btn, .qty-btn, .ci-qty-btn { min-width: 40px; min-height: 40px; }
}

</style>
</head>
